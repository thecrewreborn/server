; The Crew Reborn - Knutwurst
; https://thecrewreborn.github.io - https://ko-fi.com/knutwurst
; Copy to config.ini and fill in. Every key is optional.

[server]
; Address announced to the game (discovery, HTTP configuration). Empty = the address the game reaches the server at.
ip =
; UbiServices HTTP port; the discovery answer tells the game. When the system refuses it (another program has it, or
; Linux without root: ports below 1024 need root or cap_net_bind_service) the server takes 8080 instead.
http_port = 80
; UbiServices over TLS for the PC game (its first calls go to https://public-ubiservices.ubi.com). 0 = off.
; Falls back to 8443 like http_port.
https_port = 443
; Self-signed certificate and key for https_port; the PC game accepts them.
tls_cert = certs/server.crt
tls_key = certs/server.key
; Player save file of game version 1.21 (JSON); the named players go to players/ beside it. Relative to the server
; folder. Empty = save/1.21/player.json.
save_path =
; Your game folder, for the tables the server builds on its first start (cars, rewards, summits): the PC install
; folder or its data_win32, or a PS4 folder with app0 and patch0. Empty = the usual PC install places, else ask.
game_data =

[proxy]
; Handshake key and IV as hex (32 and 16 bytes). Empty = the key of the PS4 and PC patches. Leave them empty.
key =
iv =

[ps4]
; Address of the PS4, for developer tools only. Not needed to play.
ip =

[relay]
; UDP relay address to bind. 0.0.0.0 = all interfaces.
ip = 0.0.0.0
port = 4000

[player]
; all = every ability flag for a new player. Without abilities the PS4
; story stops at the first data station; which abilities a new player really starts with is unknown.
abilities = all
; Crew credits: a new player starts with crew_credits. crew_credits_refill = on (default): every player always has
; that many and buying with crew credits costs none. off: each save keeps its own balance and purchases take from it.
crew_credits = 1000000
crew_credits_refill = on
; DLC: off (default) = no DLC. on = every player owns every DLC pack: the Wild Run add-on (motorbikes and the drift, drag
; and monster truck specs), Calling All Units and the car packs. Switch it on only if you own the DLC for
; your copy of the game. The server cannot check that, because the official servers are gone, and unlocks the DLC for
; everyone who plays on it. This is the only switch: the PS4 patch asks the server at the start of the game, the PC
; game follows the server too. Restart the server and the game after a change. Game version 1.21 and PC only.
dlc = off

[world]
; Tell the clients about each other for peer-to-peer play (free roam, crews, races), PC and PS4 alike.
; on (default) or off. With it on every client gets the PC's calendar clock, so PC and PS4 peers agree on the time.
multiplayer = on
; Fake freeride players with names that the game spawns around you (they drive like bots because they are).
; off (default) or on; the patched game asks at start.
bots = off
; The game's idle kick (back to the login after a while without input). off (default) or on.
afk_kick = off
