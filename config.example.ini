; The server copies this file to config.ini at its first start when there is none. Change config.ini, then restart
; the server. Every key is optional.

[server]
; Address announced to the game (discovery, HTTP configuration). Empty = the address the game reaches the server at.
ip =
; UbiServices HTTP port; the discovery answer tells the game. When the system refuses it (another program has it, or
; Linux without root: ports below 1024 need root or cap_net_bind_service) the server takes 8080 instead.
http_port = 80
; UbiServices over TLS: the PC game's first calls (https://public-ubiservices.ubi.com) and the PS4's login (the PS4
; sends its key only over HTTPS). Falls back to 8443 like http_port. 0 = off: PS4 consoles cannot log in then.
https_port = 443
; Self-signed certificate and key for https_port, made at the first start; the games accept them. Relative to the
; server folder.
tls_cert = certs/server.crt
tls_key = certs/server.key
; Player save file of game version 1.21 (JSON); the named players go to players/ beside it. Relative to the server
; folder. Empty = save/1.21/player.json.
save_path =
; on (default) = a new device that logs in with a claimed name from a private or loopback address (10.x, 172.16-31.x,
; 192.168.x, 127.x) becomes one of its devices at once. off = it needs a link window (accounts link NAME) like a
; device on the internet. Set off when a proxy, tunnel or container port forward sits in front of the server: then
; every client arrives from a private address. off also switches multiplayer = lan off (see [world]).
link_home = on

[proxy]
; Handshake key and IV as hex (32 and 16 bytes). Empty = the key of the PS4 and PC patches. Leave them empty.
key =
iv =

[relay]
; UDP relay address to bind. 0.0.0.0 = all interfaces. The base game 1.00 uses the port + 100.
ip = 0.0.0.0
port = 4000

[player]
; none (default) = the abilities come from the completed missions, as in the original game.
; all = every ability flag for a new player, a cheat: zones, dealers and tuners open before the story gets there.
abilities = none
; Crew credits: a new player starts with crew_credits. crew_credits_refill = on (default): every player always has
; that many and buying with crew credits costs none. off: each save keeps its own balance and purchases take from it.
crew_credits = 1000000
crew_credits_refill = on
; DLC: off (default) = no DLC. on = every player owns every DLC pack: the Wild Run add-on (motorbikes and the drift, drag
; and monster truck specs), Calling All Units and the car packs. Switch it on only if you own the DLC for
; your copy of the game. The server cannot check that, because the official servers are gone, and unlocks the DLC for
; everyone who plays on it. This is the only switch: the PS4 patch asks the server at the start of the game, the PC
; game follows the server too. Restart the server and the game after a change. Game version 1.21 and PC only.
dlc = off

[world]
; Tell the clients about each other for peer-to-peer play (free roam, crews, races), PC and PS4 alike.
; lan (default, also when not set) = only clients from private or loopback addresses (10.x, 172.16-31.x, 192.168.x,
; 127.x), so the devices of one home network play together; with link_home = off it is off, as every client might
; arrive from a private address then. on = every client, also from the internet (multiplayer over the internet does
; not work yet). off (also an empty value) = nobody. Any other value stops the start.
multiplayer = lan
; Freeride bots: players with names that the game spawns around you and drives itself.
; off (default) or on; the patched game asks at start.
bots = off
; The game's idle kick (back to the login after a while without input). off (default) or on.
afk_kick = off

[ui]
; The admin page in the browser: the console log, the connected clients, the claimed names, the saves and a stop
; button. Devices in the home network open it at the address the server names when it starts; other addresses are
; refused. A server for the internet ([server] ip a public address, or link_home = off) keeps it on this computer.
; on (default) or off.
enabled = on
; on (default) = the browser opens the page when the server starts at a desktop. off = never.
open = on
; The page's TCP port. 0 = any free port.
port = 8090
; A password for the page. Empty = none. Write % as %%.
password =
