<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.55" stop-color="#0c1d33"/>
      <stop offset="1" stop-color="#122a45"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.6" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#b0124a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a121c"/>
      <stop offset="1" stop-color="#1a2533"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2633"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <clipPath id="sunclip"><rect x="0" y="0" width="440" height="232"/></clipPath>
    <clipPath id="disc"><circle cx="220" cy="232" r="128"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="440" height="440" fill="url(#sky)"/>
  <!-- sun with cut stripes, sitting on the horizon -->
  <g clip-path="url(#sunclip)">
    <circle cx="220" cy="232" r="128" fill="url(#sun)"/>
    <g clip-path="url(#disc)" fill="#0d1f36">
      <rect x="80" y="178" width="280" height="7"/>
      <rect x="80" y="198" width="280" height="9"/>
      <rect x="80" y="218" width="280" height="11"/>
    </g>
  </g>
  <!-- distant mountains -->
  <path d="M0 232 L60 200 L105 222 L150 190 L190 232 Z M250 232 L300 196 L340 214 L385 186 L440 220 L440 232 Z" fill="#081321"/>
  <!-- horizon line -->
  <rect x="0" y="230" width="440" height="3" fill="#2ec5ff"/>
  <!-- road -->
  <path d="M206 232 L234 232 L440 440 L0 440 Z" fill="url(#road)"/>
  <path d="M206 232 L0 440" stroke="#2ec5ff" stroke-width="5"/>
  <path d="M234 232 L440 440" stroke="#2ec5ff" stroke-width="5"/>
  <path d="M220 240 L219 262 M218 280 L216 314 M214 340 L210 400" stroke="#e8eef4" stroke-width="5" stroke-linecap="round"/>
  <!-- muscle car, rear view -->
  <g transform="translate(220 352)">
    <ellipse cx="0" cy="62" rx="150" ry="14" fill="#000" opacity="0.6"/>
    <!-- tyres -->
    <rect x="-128" y="20" width="44" height="46" rx="8" fill="#030507"/>
    <rect x="84" y="20" width="44" height="46" rx="8" fill="#030507"/>
    <!-- roof and rear window -->
    <path d="M-78 -46 Q-70 -84 -40 -88 L40 -88 Q70 -84 78 -46 Z" fill="url(#body)"/>
    <path d="M-62 -50 Q-56 -76 -34 -79 L34 -79 Q56 -76 62 -50 Z" fill="#2ec5ff" opacity="0.35"/>
    <!-- body -->
    <path d="M-140 -40 Q-140 -52 -122 -54 L122 -54 Q140 -52 140 -40 L144 30 Q144 46 126 46 L-126 46 Q-144 46 -144 30 Z" fill="url(#body)"/>
    <path d="M-140 -40 Q-140 -52 -122 -54 L122 -54 Q140 -52 140 -40" fill="none" stroke="#2ec5ff" stroke-width="3" opacity="0.7"/>
    <path d="M-78 -46 Q-70 -84 -40 -88 L40 -88 Q70 -84 78 -46" fill="none" stroke="#2ec5ff" stroke-width="3" opacity="0.7"/>
    <!-- spoiler -->
    <rect x="-128" y="-62" width="256" height="10" rx="4" fill="#0d151f"/>
    <!-- tail light bar -->
    <rect x="-122" y="-26" width="244" height="22" rx="6" fill="#ff3b3b" filter="url(#glow)" opacity="0.9"/>
    <rect x="-122" y="-26" width="244" height="22" rx="6" fill="#ff3b3b"/>
    <rect x="-14" y="-26" width="28" height="22" fill="#14202c"/>
    <!-- bumper, plate, exhausts -->
    <rect x="-132" y="14" width="264" height="8" rx="3" fill="#2ec5ff" opacity="0.8"/>
    <rect x="-30" y="22" width="60" height="18" rx="3" fill="#e8eef4"/>
    <circle cx="-96" cy="38" r="6" fill="#7a8794"/>
    <circle cx="96" cy="38" r="6" fill="#7a8794"/>
  </g>
</svg>
